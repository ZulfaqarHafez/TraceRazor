[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracerazor"
version = "1.0.3"
description = "Token efficiency auditing, adaptive sampling, and substitutability analysis for production AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zulfaqar Hafez", email = "zulfaqarhafez@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "ai", "agents", "llm", "token-efficiency", "observability",
    "tracing", "adaptive-sampling", "consensus", "langgraph", "crewai",
    "substitutability", "semantic-caching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
tracerazor = "tracerazor._launcher:main"
tracerazor-trice = "tracerazor.trice.cli:main"
tracerazor-mcp = "tracerazor.mcp_server:main"

[project.urls]
Homepage      = "https://github.com/ZulfaqarHafez/tracerazor"
Repository    = "https://github.com/ZulfaqarHafez/tracerazor"
Issues        = "https://github.com/ZulfaqarHafez/tracerazor/issues"
Changelog     = "https://github.com/ZulfaqarHafez/tracerazor/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ZulfaqarHafez/tracerazor#readme"
Security      = "https://github.com/ZulfaqarHafez/tracerazor/blob/main/SECURITY.md"

[project.optional-dependencies]
# LLM provider adapters for the sampling pillar.
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]

# Framework integrations - opt-in so the wheel stays light. Importing
# tracerazor.integrations.langgraph without these will raise ImportError.
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
crewai    = ["crewai>=0.28"]
agents    = ["openai-agents>=0.0.3"]

# HTTP mode for the audit client (REST against tracerazor-server).
http = ["requests>=2.28"]
paper = ["reportlab>=4"]

# stdio MCP server (tracerazor-mcp) — exposes the auditor to agent hosts.
mcp = ["mcp>=1.0"]

# Weight calibration tool (calibration/) — fits TAS weights to recoverable waste.
calibrate = ["numpy>=1.24", "scipy>=1.10"]

# Substitutability classifier (the redundancy subpackage).
redundancy = [
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "anthropic>=0.30",
]

# Everything at once - useful for local development.
all = [
    "openai>=1.0",
    "anthropic>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "crewai>=0.28",
    "openai-agents>=0.0.3",
    "requests>=2.28",
    "sentence-transformers>=2.7",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "reportlab>=4",
    "mcp>=1.0",
]

# Development dependencies.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio[trio]", "reportlab>=4"]

[tool.hatch.build]
exclude = [
    "/benchmark/trice/results",
]

[tool.hatch.build.targets.wheel]
packages = ["tracerazor", "benchmark"]
# Platform wheels bundle the Rust CLI at tracerazor/bin/ (see
# scripts/build_platform_wheel.sh); hatchling excludes binaries by default.
artifacts = ["tracerazor/bin/*"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/trice_patch_spec.schema.json" = "schemas/trice_patch_spec.schema.json"
"schemas/trice_evidence_manifest.schema.json" = "schemas/trice_evidence_manifest.schema.json"
"schemas/trice_suite_manifest.schema.json" = "schemas/trice_suite_manifest.schema.json"
"schemas/trice_bundle_manifest.schema.json" = "schemas/trice_bundle_manifest.schema.json"
"schemas/trice_adapter_profile.schema.json" = "schemas/trice_adapter_profile.schema.json"
"schemas/trice_run_receipt.schema.json" = "schemas/trice_run_receipt.schema.json"
"schemas/trice_claim_card.schema.json" = "schemas/trice_claim_card.schema.json"
"schemas/trice_suite_readiness.schema.json" = "schemas/trice_suite_readiness.schema.json"
"schemas/trice_artifact_card.schema.json" = "schemas/trice_artifact_card.schema.json"
"schemas/trice_protocol_lock.schema.json" = "schemas/trice_protocol_lock.schema.json"
"schemas/trice_design_card.schema.json" = "schemas/trice_design_card.schema.json"
"schemas/trice_reproduction_card.schema.json" = "schemas/trice_reproduction_card.schema.json"
"schemas/trice_release_card.schema.json" = "schemas/trice_release_card.schema.json"
"schemas/trice_contract_card.schema.json" = "schemas/trice_contract_card.schema.json"
"schemas/trice_release_evidence.schema.json" = "schemas/trice_release_evidence.schema.json"
"schemas/trice_integrity_card.schema.json" = "schemas/trice_integrity_card.schema.json"
"schemas/trice_crates_card.schema.json" = "schemas/trice_crates_card.schema.json"
"schemas/trice_install_card.schema.json" = "schemas/trice_install_card.schema.json"
"schemas/trice_research_card.schema.json" = "schemas/trice_research_card.schema.json"
"examples/trice_patch_fix_offbyone.json" = "examples/trice_patch_fix_offbyone.json"
"examples/trice_suite_fix_offbyone.json" = "examples/trice_suite_fix_offbyone.json"
"examples/trice_adapter_profile_echo.json" = "examples/trice_adapter_profile_echo.json"
"examples/trice_adapter_profile_bundled_tasks.json" = "examples/trice_adapter_profile_bundled_tasks.json"
"examples/trice_repair_bundled_tasks.py" = "examples/trice_repair_bundled_tasks.py"
"examples/trice_suite_bundled_live.json" = "examples/trice_suite_bundled_live.json"
"examples/trice_remote_smoke_patch.json" = "examples/trice_remote_smoke_patch.json"
"examples/trice_remote_smoke_source.json" = "examples/trice_remote_smoke_source.json"
"examples/trice_remote_smoke_suite.json" = "examples/trice_remote_smoke_suite.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
