[package]
name = "tracerazor-server"
description = "TraceRazor Axum HTTP server - REST API and WebSocket for the dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tracerazor-server"
path = "src/main.rs"

[dependencies]
tracerazor-core = { path = "../tracerazor-core", version = "1.1.0" }
tracerazor-ingest = { path = "../tracerazor-ingest", version = "1.1.0" }
tracerazor-semantic = { path = "../tracerazor-semantic", version = "1.1.0" }
tracerazor-store = { path = "../tracerazor-store", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs"] }
tower = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14"
dotenvy = "0.15"

[dev-dependencies]
axum-test = "15"
