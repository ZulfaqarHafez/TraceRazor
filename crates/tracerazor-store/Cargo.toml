[package]
name = "tracerazor-store"
version = "0.1.0"
edition = "2021"
description = "Persistent trace storage for TraceRazor (SQLite via tokio-rusqlite)"
license = "MIT"

[dependencies]
tracerazor-core = { path = "../tracerazor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# tokio-rusqlite wraps rusqlite in an async-friendly worker thread so the
# existing async TraceStore API can keep its signatures. `bundled` builds
# SQLite statically so we don't need the system library.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"

[dev-dependencies]
tempfile = "3"
