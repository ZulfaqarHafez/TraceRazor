[package]
name = "tracerazor"
description = "TraceRazor CLI - Agentic Reasoning Path Efficiency Auditor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
default-run = "tracerazor"

[[bin]]
name = "tracerazor"
path = "src/main.rs"

[dependencies]
tracerazor-core = { path = "../tracerazor-core", version = "1.1.0" }
tracerazor-ingest = { path = "../tracerazor-ingest", version = "1.1.0" }
tracerazor-semantic = { path = "../tracerazor-semantic", version = "1.1.0" }
tracerazor-store = { path = "../tracerazor-store", version = "1.1.0" }
tracerazor-server = { path = "../tracerazor-server", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { workspace = true }
dotenvy = "0.15"
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
zip = "0.6"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
