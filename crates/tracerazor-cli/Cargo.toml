[package]
name = "tracerazor"
description = "TraceRazor CLI - Agentic Reasoning Path Efficiency Auditor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "tracerazor"

[[bin]]
name = "tracerazor"
path = "src/main.rs"

[dependencies]
tracerazor-core = { path = "../tracerazor-core", version = "0.4.0" }
tracerazor-ingest = { path = "../tracerazor-ingest", version = "0.4.0" }
tracerazor-semantic = { path = "../tracerazor-semantic", version = "0.4.0" }
tracerazor-store = { path = "../tracerazor-store", version = "0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { workspace = true }
dotenvy = "0.15"
sha2 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
zip = "0.6"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
