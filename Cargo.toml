[workspace]
members = [
    "crates/tracerazor-core",
    "crates/tracerazor-ingest",
    "crates/tracerazor-semantic",
    "crates/tracerazor-store",
    "crates/tracerazor-server",
    "crates/tracerazor-proxy",
    "crates/tracerazor-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Zulfaqar Hafez <zulfaqarhafez@gmail.com>"]
repository = "https://github.com/ZulfaqarHafez/tracerazor"
homepage = "https://github.com/ZulfaqarHafez/tracerazor"
documentation = "https://docs.rs/tracerazor-core"
readme = "README.md"
keywords = ["llm", "agents", "observability", "tokens", "lighthouse"]
categories = ["development-tools::profiling", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
petgraph = { version = "0.6", features = ["serde-1"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
