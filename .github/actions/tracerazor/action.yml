name: TraceRazor Audit
description: >
  Audit an AI agent trace file and gate CI on a minimum TAS score and/or
  per-metric regressions against a baseline trace. v2: downloads a prebuilt
  release binary (works from any repo, no Rust toolchain), parses the report
  JSON (a malformed report fails the step instead of silently scoring 0),
  posts a sticky PR comment, and uploads the JSON report as an artifact.

inputs:
  trace-file:
    description: Path to the trace JSON file to audit.
    required: true
  threshold:
    description: Minimum TAS score (0–100). CI fails if TAS is below this value.
    required: false
    default: "70"
  baseline-trace:
    description: >
      Optional baseline trace. When set, `tracerazor compare` runs with
      --regression-threshold and any per-metric drop beyond it fails the step.
    required: false
    default: ""
  regression-threshold:
    description: Per-metric regression (%) vs the baseline that fails the gate.
    required: false
    default: "10"
  format:
    description: Format of the `report` output — "markdown" or "json". Scoring always uses JSON.
    required: false
    default: "markdown"
  version:
    description: TraceRazor release tag to download (e.g. "v0.4.1"), or "latest".
    required: false
    default: "latest"
  release-repo:
    description: GitHub repository hosting the release binaries.
    required: false
    default: "ZulfaqarHafez/TraceRazor"
  binary-path:
    description: Path to a pre-built tracerazor binary. Skips the download.
    required: false
    default: ""
  build-from-source:
    description: >
      Build the CLI with cargo instead of downloading. Requires a Rust
      toolchain and the TraceRazor sources in the workspace (i.e. you are in
      the TraceRazor repo itself).
    required: false
    default: "false"
  pr-comment:
    description: Post (and update) a sticky PR comment with the report on pull_request events.
    required: false
    default: "true"
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  tas-score:
    description: The composite TraceRazor Score (0–100).
    value: ${{ steps.audit.outputs.tas-score }}
  grade:
    description: Grade band — Excellent, Good, Fair, or Poor.
    value: ${{ steps.audit.outputs.grade }}
  passes:
    description: '"true" if TAS >= threshold, "false" otherwise.'
    value: ${{ steps.audit.outputs.passes }}
  regression-detected:
    description: '"true" if a per-metric regression beyond the threshold was found vs the baseline.'
    value: ${{ steps.audit.outputs.regression-detected }}
  tokens-saved:
    description: Estimated recoverable tokens from the audit (heuristic projection).
    value: ${{ steps.audit.outputs.tokens-saved }}
  report:
    description: Full report text (markdown or JSON, per the `format` input).
    value: ${{ steps.audit.outputs.report }}
  report-json-path:
    description: Path to the raw report JSON (also uploaded as an artifact).
    value: ${{ steps.audit.outputs.report-json-path }}

runs:
  using: composite
  steps:
    # ── Opt-in build from source (TraceRazor repo / forks only) ──────────────
    - name: Install Rust toolchain
      if: inputs.build-from-source == 'true' && inputs.binary-path == ''
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry and build artefacts
      if: inputs.build-from-source == 'true' && inputs.binary-path == ''
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: tracerazor-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: tracerazor-${{ runner.os }}-

    - name: Build tracerazor CLI from source
      if: inputs.build-from-source == 'true' && inputs.binary-path == ''
      shell: bash
      run: cargo build --release -p tracerazor

    # ── Default path: explicit binary, or prebuilt release download ──────────
    - name: Resolve tracerazor binary
      id: bin
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.build-from-source == 'true' && inputs.binary-path == '' && './target/release/tracerazor' || inputs.binary-path }}
        VERSION: ${{ inputs.version }}
        RELEASE_REPO: ${{ inputs.release-repo }}
        DEST_DIR: ${{ runner.temp }}/tracerazor-bin
      run: bash "${{ github.action_path }}/resolve-binary.sh"

    # ── Audit + optional regression gate (JSON-first) ─────────────────────────
    - name: Audit trace and gate
      id: audit
      shell: bash
      env:
        TR_BIN: ${{ steps.bin.outputs.path }}
        TRACE_FILE: ${{ inputs.trace-file }}
        THRESHOLD: ${{ inputs.threshold }}
        REPORT_FORMAT: ${{ inputs.format }}
        BASELINE_TRACE: ${{ inputs.baseline-trace }}
        REGRESSION_THRESHOLD: ${{ inputs.regression-threshold }}
        OUT_DIR: ${{ runner.temp }}/tracerazor-out
      run: bash "${{ github.action_path }}/run.sh"

    - name: Upload report artifact
      if: always() && steps.audit.outputs.report-json-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: tracerazor-report
        path: ${{ runner.temp }}/tracerazor-out/
        if-no-files-found: ignore

    - name: Post sticky PR comment
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.audit.outputs.tas-score != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BODY_FILE: ${{ runner.temp }}/tracerazor-out/comment.md
      run: |
        set -euo pipefail
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::gh CLI not available; skipping PR comment"
          exit 0
        fi
        MARKER='<!-- tracerazor-report -->'
        EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1 || true)
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
            -f body="$(cat "$BODY_FILE")" >/dev/null \
            || echo "::warning::could not update PR comment"
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$(cat "$BODY_FILE")" >/dev/null \
            || echo "::warning::could not create PR comment"
        fi
