name: TraceRazor CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust: check, test, clippy ────────────────────────────────────────────────
  rust:
    name: Rust (check + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --workspace
        # No OPENAI_API_KEY — embedding similarity falls back to bag-of-words

      - name: cargo clippy
        # Same gate as the release `quality` job, so lint failures surface on PRs.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Python: build CLI, install package, run pytest + integration smoke ───────
  python:
    name: Python (pytest + integration smoke)
    runs-on: ubuntu-latest
    env:
      TRACERAZOR_BIN: ${{ github.workspace }}/target/release/tracerazor
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI (needed for end-to-end audit)
        run: cargo build -p tracerazor --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        # dev = pytest/pytest-asyncio; mcp = the MCP server's SDK (pinned <2);
        # langgraph = langchain-core and agents = openai-agents for the
        # real-framework integration tests; http = requests for HTTP-mode tests;
        # calibrate = numpy/scipy for the calibration tool.
        run: pip install -e ".[dev,mcp,langgraph,agents,http,calibrate]"

      - name: Run pytest
        run: pytest -q

      - name: Doc tables track the current scorer (drift check)
        # Ship-plan 0.6: committed result tables must be regenerated whenever
        # scoring changes; stale numbers read as dishonesty.
        run: |
          python -m benchmark.run_benchmarks
          git diff --exit-code benchmark/RESULTS.md \
            || { echo "::error::benchmark/RESULTS.md is stale — regenerate with 'python -m benchmark.run_benchmarks' and commit."; exit 1; }

      - name: End-to-end audit via real binary
        run: |
          python - <<'PY'
          import json
          from tracerazor import TraceRazorClient
          trace = json.load(open("traces/support-agent-run-2847.json"))
          report = TraceRazorClient().analyse(trace)
          assert 0 <= report.tas_score <= 100, report.tas_score
          assert report.total_steps > 0, report.total_steps
          print("E2E OK:", report.summary())
          PY

      - name: Calibration smoke (real in-repo before/after pairs)
        run: |
          python -m calibration.calibrate \
            --dataset calibration/examples/swe_agent_pairs.json \
            --out /tmp/weights.json --report /tmp/report.md --cv 3 --features
          # The fitted weights must load back into the engine.
          ./target/release/tracerazor audit traces/support-agent-run-2847.json \
            --weights /tmp/weights.json --format json > /dev/null
          echo "calibration smoke OK"

  # ── Paper: compile the LaTeX technical report to a PDF artifact ───────────────
  paper:
    name: Paper (build PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: tracerazor.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracerazor-paper
          path: paper/tracerazor.pdf
          if-no-files-found: error

  # ── Supply-chain: cargo-deny (advisories, bans, licenses), pip-audit ─────────
  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo deny
        # `cargo deny check` includes the RustSec advisories check, so a
        # separate cargo-audit run would only repeat it.
        run: |
          cargo install cargo-deny --locked --quiet
          cargo deny check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit
        # Audit TraceRazor's own dependency set (same gate as the release
        # workflow), not the runner's preinstalled packages.
        run: |
          python -m pip install --upgrade pip pip-audit --quiet
          python -m pip_audit --progress-spinner off .

  trice-integrity:
    name: TRICE integrity gate
    # Match the Linux x64 release-wheel builder so the integrity evidence is
    # produced against the same explicit glibc floor as the published wheel.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build release subjects
        env:
          TRACERAZOR_EXPECTED_GLIBC: "2.35"
          TRACERAZOR_EXPECTED_WHEEL_PLATFORM: manylinux_2_35_x86_64
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cargo build --release -p tracerazor
          bash scripts/build_platform_wheel.sh

      - name: Generate runtime release evidence
        run: |
          python -m tracerazor.trice crates \
            --offline \
            --out /tmp/trice_crates_card.json \
            --format tex
          python -m tracerazor.trice verify-crates /tmp/trice_crates_card.json
          python -m tracerazor.trice install \
            --out /tmp/trice_install_card.json \
            --dist-dir dist \
            --format tex
          python -m tracerazor.trice verify-install /tmp/trice_install_card.json
          python -m tracerazor.trice research \
            --out /tmp/trice_research_card.json \
            --format tex
          python -m tracerazor.trice verify-research /tmp/trice_research_card.json
          python -m tracerazor.trice release-evidence \
            --out /tmp/trice_release_evidence.json \
            --dist-dir dist \
            --cli-binary target/release/tracerazor \
            --format tex
          python -m tracerazor.trice verify-release-evidence /tmp/trice_release_evidence.json
          git diff --exit-code

      - name: Verify TRICE proof graph integrity
        run: |
          python -m tracerazor.trice integrity \
            --release-evidence /tmp/trice_release_evidence.json \
            --crates /tmp/trice_crates_card.json \
            --install /tmp/trice_install_card.json \
            --research /tmp/trice_research_card.json \
            --out /tmp/trice_integrity_card.json \
            --format tex
          python -m tracerazor.trice verify-integrity /tmp/trice_integrity_card.json
# Version consistency (Cargo.toml vs pyproject.toml vs README) is enforced by
# tests/test_readme_claims.py::test_one_version_everywhere in the python job.
