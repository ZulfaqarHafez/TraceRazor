name: TraceRazor CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust: check, test, clippy ────────────────────────────────────────────────
  rust:
    name: Rust (check + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace
        # No OPENAI_API_KEY — Phase 2 metrics are skipped gracefully

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Dashboard: build ─────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: npm install
        run: npm ci

      - name: npm build
        run: npm run build

  # ── Python: build CLI, install package, run pytest + integration smoke ───────
  python:
    name: Python (pytest + integration smoke)
    runs-on: ubuntu-latest
    env:
      TRACERAZOR_BIN: ${{ github.workspace }}/target/release/tracerazor
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI (needed for end-to-end audit)
        run: cargo build -p tracerazor --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        # dev = pytest/pytest-asyncio; langgraph = langchain-core for the
        # langgraph integration test; http = requests for HTTP-mode tests;
        # calibrate = numpy/scipy for the weight-calibration tool + tests.
        run: pip install -e ".[dev,langgraph,http,calibrate]"

      - name: Run pytest
        run: pytest -q

      - name: End-to-end audit via real binary
        run: |
          python - <<'PY'
          import json
          from tracerazor import TraceRazorClient
          trace = json.load(open("traces/support-agent-run-2847.json"))
          report = TraceRazorClient().analyse(trace)
          assert 0 <= report.tas_score <= 100, report.tas_score
          assert report.total_steps > 0, report.total_steps
          print("E2E OK:", report.summary())
          PY

      - name: Calibration smoke (generate dataset + fit weights)
        run: |
          python -m calibration.make_example_dataset --out /tmp/caldata --n 24
          python -m calibration.calibrate \
            --dataset /tmp/caldata/manifest.json \
            --out /tmp/weights.json --report /tmp/report.md --cv 4
          # The fitted weights must load back into the engine.
          ./target/release/tracerazor audit traces/support-agent-run-2847.json \
            --weights /tmp/weights.json --format json > /dev/null
          echo "calibration smoke OK"

  # ── TAS gate: run sample trace and fail if score < 60 ────────────────────────
  tas-gate:
    name: TAS Gate (sample trace)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        run: cargo build -p tracerazor --release

      - name: Run TAS gate on sample trace
        run: |
          ./target/release/tracerazor audit \
            traces/support-agent-run-2847.json \
            --threshold 60
        # Exit code 1 if TAS < threshold — fails the build

  # ── Paper: compile the LaTeX technical report to a PDF artifact ───────────────
  paper:
    name: Paper (build PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: tracerazor.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracerazor-paper
          path: paper/tracerazor.pdf
          if-no-files-found: error
