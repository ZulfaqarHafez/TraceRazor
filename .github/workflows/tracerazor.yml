name: TraceRazor CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust: check, test, clippy ────────────────────────────────────────────────
  rust:
    name: Rust (check + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace
        # No OPENAI_API_KEY — Phase 2 metrics are skipped gracefully

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Dashboard: build ─────────────────────────────────────────────────────────
  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: npm install
        run: npm ci

      - name: npm build
        run: npm run build

  # ── Python: build CLI, install package, run pytest + integration smoke ───────
  python:
    name: Python (pytest + integration smoke)
    runs-on: ubuntu-latest
    env:
      TRACERAZOR_BIN: ${{ github.workspace }}/target/release/tracerazor
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI (needed for end-to-end audit)
        run: cargo build -p tracerazor --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        # dev = pytest/pytest-asyncio; langgraph = langchain-core and agents =
        # openai-agents for the real-framework integration tests; http = requests
        # for HTTP-mode tests; calibrate = numpy/scipy for the calibration tool.
        run: pip install -e ".[dev,langgraph,agents,http,calibrate]"

      - name: Run pytest
        run: pytest -q

      - name: Doc tables track the current scorer (drift check)
        # Ship-plan 0.6: committed result tables must be regenerated whenever
        # scoring changes; stale numbers read as dishonesty.
        run: |
          python benchmark/run_benchmarks.py
          git diff --exit-code benchmark/RESULTS.md \
            || { echo "::error::benchmark/RESULTS.md is stale — regenerate with 'python benchmark/run_benchmarks.py' and commit."; exit 1; }

      - name: End-to-end audit via real binary
        run: |
          python - <<'PY'
          import json
          from tracerazor import TraceRazorClient
          trace = json.load(open("traces/support-agent-run-2847.json"))
          report = TraceRazorClient().analyse(trace)
          assert 0 <= report.tas_score <= 100, report.tas_score
          assert report.total_steps > 0, report.total_steps
          print("E2E OK:", report.summary())
          PY

      - name: Calibration smoke (real in-repo before/after pairs)
        run: |
          python -m calibration.calibrate \
            --dataset calibration/examples/swe_agent_pairs.json \
            --out /tmp/weights.json --report /tmp/report.md --cv 3 --features
          # The fitted weights must load back into the engine.
          ./target/release/tracerazor audit traces/support-agent-run-2847.json \
            --weights /tmp/weights.json --format json > /dev/null
          echo "calibration smoke OK"

  # ── TAS gate: run sample trace and fail if score < 60 ────────────────────────
  tas-gate:
    name: TAS Gate (sample trace)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        run: cargo build -p tracerazor --release

      - name: Run TAS gate on sample trace
        run: |
          ./target/release/tracerazor audit \
            traces/support-agent-run-2847.json \
            --threshold 60
        # Exit code 1 if TAS < threshold — fails the build

  # ── Paper: compile the LaTeX technical report to a PDF artifact ───────────────
  paper:
    name: Paper (build PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: tracerazor.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracerazor-paper
          path: paper/tracerazor.pdf
          if-no-files-found: error

  # ── Supply-chain: cargo-audit, cargo-deny, pip-audit ─────────────────────────
  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked --quiet
          cargo deny check
      - name: pip-audit
        run: |
          pip install pip-audit --quiet
          pip-audit || true   # advisory only until baseline is clean

  # ── Version consistency: Cargo.toml vs pyproject.toml vs README ──────────────
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= "//;s/".*//')
          PY_VER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= "//;s/".*//' || echo "not-found")
          echo "Cargo version: $CARGO_VER"
          echo "pyproject version: $PY_VER"
          if [ "$PY_VER" != "not-found" ] && [ "$CARGO_VER" != "$PY_VER" ]; then
            echo "ERROR: Version mismatch Cargo=$CARGO_VER vs pyproject=$PY_VER"
            exit 1
          fi
          README_VER=$(grep -oP '(?<=tracerazor v)[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 || echo "not-found")
          echo "README version: $README_VER"
          echo "All versions consistent."
