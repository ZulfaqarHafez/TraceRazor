name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.1 (created at the chosen ref if missing)'
        required: true
        type: string

jobs:
  # Resolve (and on workflow_dispatch, create) the release tag. On tag-push
  # events this just verifies the pushed tag, so downstream jobs can depend
  # on it unconditionally in both modes.
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve or create tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            case "$TAG" in v*) ;; *) echo "tag must look like vX.Y.Z, got '$TAG'" >&2; exit 1 ;; esac
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "tag $TAG already exists — releasing it"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
              echo "created tag $TAG at $GITHUB_SHA"
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  wheels:
    name: Platform wheel (${{ matrix.os }})
    needs: [tag]
    strategy:
      matrix:
        # ubuntu-22.04 (glibc 2.35) keeps the manylinux floor low; macos-latest
        # covers arm64 and macos-13 covers Intel.
        os: [ubuntu-22.04, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build platform wheel with bundled CLI
        run: bash scripts/build_platform_wheel.sh
      - name: Build sdist (once, on the Linux builder)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          rm -rf tracerazor/bin   # sdist is source-only; no prebuilt binary
          python -m build --sdist
      - name: Clean-room smoke test
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/tracerazor-*.whl
          /tmp/v/bin/tracerazor audit traces/support-agent-run-2847.json --hermetic
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Standalone CLI binaries — downloaded by the composite GitHub Action
  # (.github/actions/tracerazor) so consumer repos need no Rust toolchain.
  binaries:
    name: Release binary (${{ matrix.target }})
    needs: [tag]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p tracerazor --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/tracerazor audit traces/support-agent-run-2847.json --hermetic
      - name: Package
        run: |
          tar -czf tracerazor-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release tracerazor
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: tracerazor-*.tar.gz

  # Upload wheels + sdist to PyPI via trusted publishing (OIDC — no token
  # stored in the repo). One-time setup on pypi.org: project "tracerazor" →
  # Publishing → add GitHub publisher (owner ZulfaqarHafez, repo TraceRazor,
  # workflow release.yml, environment pypi). publish.sh stays as the manual
  # fallback.
  pypi:
    name: Publish to PyPI
    needs: [tag, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Attach wheels + binaries to the GitHub release.
  publish-release:
    name: Publish GitHub release
    needs: [tag, wheels, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=$(find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \))
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$RELEASE_TAG" $ASSETS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$RELEASE_TAG" $ASSETS \
              --verify-tag --generate-notes --title "TraceRazor $RELEASE_TAG"
          fi
