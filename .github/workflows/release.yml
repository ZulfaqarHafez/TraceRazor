name: Release

on:
  push:
    tags: ["v*"]
    # Pushing a branch named release-cut/vX.Y.Z cuts the release for that
    # version at the pushed commit — equivalent to the workflow_dispatch
    # path, for environments that can push branches but not tags or
    # dispatch workflows.
    branches: ["release-cut/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.1 (created at the chosen ref if missing)'
        required: true
        type: string

jobs:
  # Resolve (and on workflow_dispatch, create) the release tag. On tag-push
  # events this just verifies the pushed tag, so downstream jobs can depend
  # on it unconditionally in both modes.
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve or create tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/heads/release-cut/* ]]; then
            TAG="${GITHUB_REF_NAME#release-cut/}"
          else
            TAG="$GITHUB_REF_NAME"   # tag-push event
          fi
          case "$TAG" in v*) ;; *) echo "tag must look like vX.Y.Z, got '$TAG'" >&2; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — releasing it"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            echo "created tag $TAG at $GITHUB_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  wheels:
    name: Platform wheel (${{ matrix.os }})
    needs: [tag]
    strategy:
      matrix:
        # ubuntu-22.04 (glibc 2.35) keeps the manylinux floor low; macos-latest
        # covers arm64 and macos-13 covers Intel. windows-latest bundles the
        # .exe so `pip install tracerazor` works on Windows without Rust.
        os: [ubuntu-22.04, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build platform wheel with bundled CLI (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build_platform_wheel.sh
      - name: Build platform wheel with bundled CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p tracerazor
          New-Item -ItemType Directory -Force tracerazor/bin | Out-Null
          Copy-Item target/release/tracerazor.exe tracerazor/bin/tracerazor.exe
          python -m pip install --quiet build wheel
          python -m build --wheel
          $wheel = Get-ChildItem dist\tracerazor-*-py3-none-any.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python -m wheel tags --platform-tag win_amd64 --remove $wheel.FullName
      - name: Build sdist (once, on the Linux builder)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          rm -rf tracerazor/bin   # sdist is source-only; no prebuilt binary
          python -m build --sdist
      - name: Clean-room smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/tracerazor-*.whl
          /tmp/v/bin/tracerazor audit traces/support-agent-run-2847.json --hermetic
      - name: Clean-room smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv C:\tmp\v
          C:\tmp\v\Scripts\pip install (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          C:\tmp\v\Scripts\tracerazor audit traces/support-agent-run-2847.json --hermetic
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Standalone CLI binaries — downloaded by the composite GitHub Action
  # (.github/actions/tracerazor) so consumer repos need no Rust toolchain.
  binaries:
    name: Release binary (${{ matrix.target }})
    needs: [tag]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p tracerazor --target ${{ matrix.target }}
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/tracerazor audit traces/support-agent-run-2847.json --hermetic
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\${{ matrix.target }}\release\tracerazor.exe audit traces/support-agent-run-2847.json --hermetic
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf tracerazor-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release tracerazor
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\tracerazor.exe `
            -DestinationPath tracerazor-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            tracerazor-*.tar.gz
            tracerazor-*.zip

  # Upload wheels + sdist to PyPI via trusted publishing (OIDC — no token
  # stored in the repo). One-time setup on pypi.org: project "tracerazor" →
  # Publishing → add GitHub publisher (owner ZulfaqarHafez, repo TraceRazor,
  # workflow release.yml, environment pypi). publish.sh stays as the manual
  # fallback.
  pypi:
    name: Publish to PyPI
    needs: [tag, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Generate deterministic release evidence sidecars from the exact release
  # artifacts staged by the wheel jobs. PyPI Trusted Publishing covers index
  # attestations; this packet covers GitHub release assets, SBOMs, checksums,
  # proof cards, installability, the crates publish card, paper artifacts, and evidence bundles.
  release-evidence:
    name: Release evidence packet
    needs: [tag, wheels, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Build release CLI for evidence subject
        run: cargo build --release -p tracerazor
      - name: Generate and verify release evidence
        run: |
          python -m tracerazor.trice crates \
            --offline \
            --out docs/trice_crates_card.json \
            --format tex
          python -m tracerazor.trice verify-crates docs/trice_crates_card.json
          python -m tracerazor.trice install \
            --out docs/trice_install_card.json \
            --dist-dir dist \
            --format tex
          python -m tracerazor.trice verify-install docs/trice_install_card.json
          python -m tracerazor.trice research \
            --out docs/trice_research_card.json \
            --format tex
          python -m tracerazor.trice verify-research docs/trice_research_card.json
          mkdir -p release-assets
          cp docs/trice_crates_card.* release-assets/
          cp docs/trice_install_card.* release-assets/
          cp docs/trice_research_card.* release-assets/
          python -m tracerazor.trice release-evidence \
            --out release-assets/trice_release_evidence.json \
            --dist-dir dist \
            --cli-binary target/release/tracerazor \
            --format tex
          python -m tracerazor.trice verify-release-evidence \
            release-assets/trice_release_evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release-assets/trice_release_evidence.*
            release-assets/trice_crates_card.*
            release-assets/trice_install_card.*
            release-assets/trice_research_card.*

  # Attach wheels, binaries, and deterministic release evidence to the GitHub release.
  publish-release:
    name: Publish GitHub release
    needs: [tag, wheels, binaries, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/trice_crates_card.*
            artifacts/**/trice_install_card.*
            artifacts/**/trice_research_card.*
            artifacts/**/trice_release_evidence.*
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=$(find artifacts -type f \( \
            -name '*.whl' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name 'trice_crates_card.*' -o \
            -name 'trice_install_card.*' -o \
            -name 'trice_research_card.*' -o \
            -name 'trice_release_evidence.*' \
          \))
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$RELEASE_TAG" $ASSETS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$RELEASE_TAG" $ASSETS \
              --verify-tag --generate-notes --title "TraceRazor $RELEASE_TAG"
          fi
